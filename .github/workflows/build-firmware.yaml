name: Firmware at GHA

#
# GitHub Actions firmware build for Seth's rusEFI fork.
#
# Normal push/manual builds:
#   - Build Proteus variants only
#   - Store outputs as GitHub Actions artifacts
#
# Scheduled nightly builds:
#   - Build Proteus variants only
#   - Create/update a GitHub prerelease
#   - Attach firmware bundles to that release
#
# Manual builds:
#   - Can optionally create a GitHub prerelease
#
# This fork does NOT upload firmware or INI files to rusEFI servers.
#

on:
  push:
  pull_request:

  schedule:
    # Daily at 00:27 UTC
    - cron: '27 0 * * *'

  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub prerelease from this build'
        required: false
        type: boolean
        default: false

      lts:
        description: 'LTS Build'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  #
  # LibOpenBLT host libraries
  #
  build-libopenblt-linux:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: cmake configure libopenblt
        working-directory: ./firmware/ext/openblt/Host/Source/LibOpenBLT/build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release ..

#      - name: make libopenblt
#        working-directory: ./firmware/ext/openblt/Host/Source/LibOpenBLT/build
#        run: make -j8

      - name: cmake configure libopenblt_jni
        working-directory: ./misc/libopenblt_jni/build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release ..

#      - name: make libopenblt_jni
#        working-directory: ./misc/libopenblt_jni/build
#        run: make -j8

      - name: coalesce
        if: 0
        run: |
          mkdir deliver
          cp ./firmware/ext/openblt/Host/libopenblt.so deliver/
          cp ./misc/libopenblt_jni/build/libopenblt_jni.so deliver/

#      - uses: actions/upload-artifact@v7
#        if: 0
#        with:
#          name: libopenblt-linux
#          path: |
#            ./deliver/libopenblt.so
#            ./deliver/libopenblt_jni.so


  #
  # Prepare GitHub release
  #
  # No rusEFI server uploads happen here.
  #
  release:
    runs-on: ubuntu-latest

    steps:

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "$GITHUB_CONTEXT"

      - name: Set release variables
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "full=true" >> "$GITHUB_ENV"
            echo "upload=release" >> "$GITHUB_ENV"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.release }}" = "true" ]; then
            echo "full=true" >> "$GITHUB_ENV"
            echo "upload=release" >> "$GITHUB_ENV"

          else
            echo "full=false" >> "$GITHUB_ENV"
            echo "upload=gha_artifact" >> "$GITHUB_ENV"
          fi

      - uses: mukunku/tag-exists-action@v1.7.0
        id: checkTag
        with:
          tag: ${{ env.date }}

      - name: Create Release Tag
        if: ${{ env.upload == 'release' && steps.checkTag.outputs.exists == 'false' }}
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ env.date }}
          tag_prefix: ''

      - uses: actions/checkout@v7
        if: ${{ env.upload == 'release' }}
        with:
          sparse-checkout: misc/actions
          sparse-checkout-cone-mode: false

      - name: Generate Changelog
        if: ${{ env.upload == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash misc/actions/nightly_changelog.sh \
            "${{ github.repository }}" \
            "${{ env.date }}" \
            "${{ github.sha }}" \
            changelog.md

      - name: Create Release
        if: ${{ env.upload == 'release' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.date }}
          name: "Nightly ${{ env.date }}"
          bodyFile: changelog.md
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          prerelease: true


  #
  # Generate the firmware build matrix
  #
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:

      - uses: actions/checkout@v7

      - name: Set matrix
        id: set-matrix
        working-directory: firmware
        run: |
          export EVENT_NAME="${{ github.event_name }}"
          export RUN_ATTEMPT="${{ github.run_attempt }}"

          read -d '' COMMIT_MESSAGE << EOM || true
          ${{ github.event.head_commit.message }}
          EOM

          export COMMIT_MESSAGE

          #
          # Let rusEFI generate its normal complete matrix first.
          #
          MATRIX=$(bash bin/generate_matrix.sh config/boards)

          #
          # Keep ONLY Proteus targets.
          #
          # Examples:
          #   proteus_f4
          #   proteus_f7
          #   proteus_f4_hardware_QC_special_build
          #   proteus_f7_hardware_QC_special_build
          #
          MATRIX=$(echo "$MATRIX" | jq -c '
            {
              include: [
                .include[]
                | select(."build-target" | startswith("proteus"))
              ]
            }
          ')

          echo "Proteus-only build matrix:"
          echo "$MATRIX"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"


  #
  # Build firmware
  #
  build-firmware:
    runs-on: ubuntu-latest

    needs:
      - release
      - generate-matrix

    if: ${{ ! contains(needs.generate-matrix.outputs.matrix, '[]') }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:

      #
      # Current date
      #
      - name: Get current date
        id: date
        run: |
          echo "BUNDLE_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"


      #
      # Set build mode
      #
      # IMPORTANT:
      #
      # There is intentionally NO "server" mode in this fork.
      #
      # Scheduled/manual-release build:
      #   -> GitHub Release
      #
      # Everything else:
      #   -> GitHub Actions artifacts
      #
      - name: Set run condition variables
        env:
          GH_REF: ${{ github.ref }}
        run: |

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Creating nightly GitHub release"
            echo "full=true" >> "$GITHUB_ENV"
            echo "upload=release" >> "$GITHUB_ENV"
            echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.release }}" = "true" ]; then
            echo "Creating manual GitHub release"
            echo "full=true" >> "$GITHUB_ENV"
            echo "upload=release" >> "$GITHUB_ENV"
            echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

          else
            echo "GitHub Actions artifact mode"
            echo "full=false" >> "$GITHUB_ENV"
            echo "upload=gha_artifact" >> "$GITHUB_ENV"
          fi


      #
      # Checkout
      #
      - uses: actions/checkout@v7


      #
      # Submodules
      #
      - name: Checkout Submodules
        run: |
          misc/git_scripts/common_submodule_init.sh


      #
      # Java
      #
      - uses: ./.github/actions/setup-java


      #
      # Build dependencies
      #
      - name: Install multilib, mingw, sshpass and mtools
        run: |
          sudo bash misc/actions/add-ubuntu-latest-apt-mirrors.sh
          sudo bash misc/actions/ubuntu-install-tools.sh


      #
      # Build environment
      #
      - name: Set Build Env Variables
        env:
          REF_NAME: ${{ github.ref_name }}
          META_INFO: ${{ matrix.meta-info }}
        run: |
          echo "AUTOMATION_LTS=${{ toJSON(inputs.lts) }}" >> "$GITHUB_ENV"
          echo "AUTOMATION_REF=$REF_NAME" >> "$GITHUB_ENV"
          echo "BOARD_META_PATH=$META_INFO" >> "$GITHUB_ENV"
          echo "WHITE_LABEL=rusefi" >> "$GITHUB_ENV"


      #
      # Git status
      #
      - name: Git Status
        run: |
          git status


      #
      # ARM compiler
      #
      - name: Acquire Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Test arm-none-eabi-gcc Compiler
        run: |
          arm-none-eabi-gcc -v


      #
      # Clean build
      #
      - name: Clean (Just in Case)
        working-directory: ./firmware/
        run: |
          make clean


      #
      # Generate configs
      #
      - name: Handle configs separately just to make github logs more readable
        working-directory: ./firmware/
        run: |
          bash bin/compile.sh ${{ env.BOARD_META_PATH }} docs-enums
          bash bin/compile.sh ${{ env.BOARD_META_PATH }} config


      #
      # Check generated config
      #
      - name: Check config diff
        working-directory: ./firmware/
        run: |
          colordiff < generated.patch


      #
      # Simulator
      #
      - name: Building Windows simulator separately just to make github logs more readable
        working-directory: ./firmware/
        run: |
          bash bin/compile.sh \
            ${{ env.BOARD_META_PATH }} \
            ../simulator/build/rusefi_simulator.exe


      #
      # Firmware
      #
      - name: Build Firmware
        working-directory: ./firmware/
        run: |
          bash bin/compile.sh \
            ${{ env.BOARD_META_PATH }} \
            build_both_bundles \
            --output-sync=recurse


      #
      # Validation
      #
      - name: Check for illegal time conversions
        working-directory: ./firmware/
        run: |
          bash check_illegal_conversion.sh


      #
      # Add bundle to GitHub release
      #
      - name: Add Bundles to Release
        if: ${{ env.upload == 'release' }}
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ env.date }}
          name: "Nightly ${{ env.date }}"
          artifacts: "artifacts/rusefi_bundle_*.zip"
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          prerelease: true


      #
      # Normal GitHub Actions artifacts
      #
      - name: elf2text
        if: ${{ env.upload == 'gha_artifact' }}
        working-directory: ./firmware/build
        run: |
          arm-none-eabi-objdump -d rusefi.elf > rusefi.txt


      - name: Upload github action text artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.txt
          path: ./firmware/build/rusefi.txt


      - name: Upload github action elf artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.elf
          path: ./firmware/build/rusefi.elf


      - name: Upload github action map artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.map
          path: ./firmware/build/rusefi.map


      - name: Upload github action bin artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.bin
          path: ./firmware/deliver/rusefi*.bin


      - name: Upload github action hex artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.hex
          path: ./firmware/build/rusefi*.hex


      - name: Upload github action dfu artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.dfu
          path: ./firmware/deliver/rusefi*.dfu


      #
      # Bundle artifact
      #
      - name: Upload bundle artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rusefi_bundle_${{ matrix.build-target }}.zip
          path: ./artifacts/rusefi_bundle_${{ matrix.build-target }}.zip


      #
      # Autoupdate bundle artifact
      #
      - name: Upload github action autoupdate artifact
        if: ${{ env.upload == 'gha_artifact' }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rusefi_bundle_${{ matrix.build-target }}_autoupdate.zip
          path: ./artifacts/rusefi_bundle_${{ matrix.build-target }}_autoupdate.zip


  #
  # Universal bundle
  #
  build-universal-bundle:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - name: Checkout bundle submodules
        run: |
          git submodule update --init --depth=1 \
            firmware/ext/rusefi-gha \
            java_console/luaformatter \
            java_console/peak-can-basic


      - uses: ./.github/actions/setup-java


      - name: Build console jar
        run: |
          ./gradlew :ui:shadowJar :ts_plugin_launcher:shadowJar


      - name: Assemble universal bundle
        run: |
          mkdir -p artifacts

          WHITE_LABEL=rusefi \
            bash firmware/bin/assemble_universal_bundle.sh \
            ./artifacts \
            universal


      #
      # Normal universal bundle artifact
      #
      - name: Upload universal bundle artifact
        if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.release == true) }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rusefi_bundle_universal.zip
          path: ./artifacts/rusefi_bundle_universal.zip


      - name: Upload universal autoupdate artifact
        if: ${{ github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.release == true) }}
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rusefi_bundle_universal_autoupdate.zip
          path: ./artifacts/rusefi_bundle_universal_autoupdate.zip


      #
      # Universal bundle to GitHub release
      #
      - name: Add universal bundle to Release
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.release == true) }}
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ github.run_number }}-universal
          name: "Nightly ${{ github.run_number }}"
          artifacts: |
            ./artifacts/rusefi_bundle_universal.zip
            ./artifacts/rusefi_bundle_universal_autoupdate.zip
          replacesArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          prerelease: true
