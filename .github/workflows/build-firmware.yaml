name: Firmware at GHA

#
# GitHub Actions firmware build for Seth's rusEFI fork.
#
# Builds:
#   - All Proteus variants
#   - Brick
#
# Normal push / pull request / manual build:
#   - Build firmware
#   - Upload results as GitHub Actions artifacts
#
# Scheduled nightly build:
#   - Build firmware
#   - Wait for ALL firmware builds to finish
#   - Create a GitHub prerelease
#   - Attach ONLY rusefi_bundle_brick.zip
#
# Manual release build:
#   - Same behavior when "Create a GitHub prerelease" is checked
#
# IMPORTANT:
#   - This fork does NOT upload firmware to rusEFI servers.
#   - This fork does NOT upload INI files to rusEFI servers.
#   - There is intentionally NO "server" upload mode.
#

on:
  push:
  pull_request:

  schedule:
    # Daily at 00:27 UTC
    - cron: '27 0 * * *'

  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub prerelease from this build'
        required: false
        type: boolean
        default: false

      lts:
        description: 'LTS Build'
        required: false
        type: boolean
        default: false

permissions:
  contents: write


jobs:

  #
  # Determine whether this run should publish a GitHub release.
  #
  prepare-release:
    runs-on: ubuntu-latest

    outputs:
      publish: ${{ steps.mode.outputs.publish }}
      tag: ${{ steps.mode.outputs.tag }}
      name: ${{ steps.mode.outputs.name }}

    steps:

      - name: Determine release mode
        id: mode
        shell: bash
        run: |
          DATE="$(date +'%Y-%m-%d')"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=nightly-${DATE}" >> "$GITHUB_OUTPUT"
            echo "name=Nightly ${DATE}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && [ "${{ inputs.release }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=manual-${DATE}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=Test Build ${DATE} #${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
          fi


  #
  # LibOpenBLT host libraries.
  #
  # This is kept from the original rusEFI workflow.
  # It does not upload anything to a server.
  #
  build-libopenblt-linux:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: cmake configure libopenblt
        working-directory: ./firmware/ext/openblt/Host/Source/LibOpenBLT/build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: cmake configure libopenblt_jni
        working-directory: ./misc/libopenblt_jni/build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release ..


  #
  # Generate firmware build matrix.
  #
  generate-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:

      - uses: actions/checkout@v7

      - name: Set matrix
        id: set-matrix
        working-directory: firmware
        shell: bash
        run: |
          export EVENT_NAME="${{ github.event_name }}"
          export RUN_ATTEMPT="${{ github.run_attempt }}"

          read -d '' COMMIT_MESSAGE << EOM || true
          ${{ github.event.head_commit.message }}
          EOM

          export COMMIT_MESSAGE

          #
          # Run rusEFI's normal matrix generator.
          #
          set +e
          MATRIX_RAW=$(bash bin/generate_matrix.sh config/boards)
          GENERATOR_RC=$?
          set -e

          echo "generate_matrix.sh exit code: $GENERATOR_RC"

          if [ "$GENERATOR_RC" -ne 0 ]; then
            echo "::warning::generate_matrix.sh returned $GENERATOR_RC; continuing with generated matrix output."
          fi

          echo "Raw matrix:"
          echo "$MATRIX_RAW"

          #
          # Remove trailing comma before the closing JSON array.
          #
          MATRIX_CLEAN=$(printf '%s' "$MATRIX_RAW" | \
            sed -E 's/,[[:space:]]*]/]/g')

          #
          # Validate generated JSON.
          #
          echo "$MATRIX_CLEAN" | jq empty

          #
          # Keep:
          #   - every Proteus target
          #   - exact target "brick"
          #
          MATRIX=$(echo "$MATRIX_CLEAN" | jq -c '
            {
              include: [
                .include[]
                | select(
                    (."build-target" | startswith("proteus"))
                    or
                    (."build-target" == "brick")
                  )
              ]
            }
          ')

          echo
          echo "Proteus + Brick build matrix:"
          echo "$MATRIX"
          echo

          #
          # Validate filtered matrix.
          #
          echo "$MATRIX" | jq empty

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"


  #
  # Build Proteus + Brick firmware.
  #
  build-firmware:
    runs-on: ubuntu-latest

    needs:
      - prepare-release
      - generate-matrix

    if: ${{ ! contains(needs.generate-matrix.outputs.matrix, '"include":[]') }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:

      #
      # Current date.
      #
      - name: Get current date
        run: |
          echo "BUNDLE_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"


      #
      # Determine output mode.
      #
      # There is intentionally NO server mode.
      #
      - name: Set run condition variables
        run: |

          if [ "${{ needs.prepare-release.outputs.publish }}" = "true" ]; then
            echo "Release build"
            echo "full=true" >> "$GITHUB_ENV"
            echo "upload=release" >> "$GITHUB_ENV"

          else
            echo "GitHub Actions artifact build"
            echo "full=false" >> "$GITHUB_ENV"
            echo "upload=gha_artifact" >> "$GITHUB_ENV"
          fi


      #
      # Checkout source.
      #
      - uses: actions/checkout@v7


      #
      # Submodules.
      #
      - name: Checkout Submodules
        run: |
          misc/git_scripts/common_submodule_init.sh


      #
      # Java environment.
      #
      - uses: ./.github/actions/setup-java


      #
      # Build dependencies.
      #
      - name: Install multilib, mingw, sshpass and mtools
        run: |
          sudo bash misc/actions/add-ubuntu-latest-apt-mirrors.sh
          sudo bash misc/actions/ubuntu-install-tools.sh


      #
      # Build environment variables.
      #
      - name: Set Build Env Variables
        env:
          REF_NAME: ${{ github.ref_name }}
          META_INFO: ${{ matrix.meta-info }}
        run: |
          echo "AUTOMATION_LTS=${{ toJSON(inputs.lts) }}" >> "$GITHUB_ENV"
          echo "AUTOMATION_REF=$REF_NAME" >> "$GITHUB_ENV"
          echo "BOARD_META_PATH=$META_INFO" >> "$GITHUB_ENV"
          echo "WHITE_LABEL=rusefi" >> "$GITHUB_ENV"


      #
      # Git state.
      #
      - name: Git Status
        run: |
          git status


      #
      # ARM compiler.
      #
      - name: Acquire Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1.13.0
        with:
          release: '14.2.Rel1'

      - name: Test arm-none-eabi-gcc Compiler
        run: |
          arm-none-eabi-gcc -v


      #
      # Clean build.
      #
      - name: Clean (Just in Case)
        working-directory: ./firmware/
        run: |
          make clean


      #
      # Generate configuration.
      #
      - name: Handle configs separately just to make github logs more readable
        working-directory: ./firmware/
        run: |
          bash bin/compile.sh ${{ env.BOARD_META_PATH }} docs-enums
          bash bin/compile.sh ${{ env.BOARD_META_PATH }} config


      #
      # Check generated config.
      #
      - name: Check config diff
        working-directory: ./firmware/
        run: |
          colordiff < generated.patch


      #
      # Simulator build.
      #
      - name: Building Windows simulator separately just to make github logs more readable
        working-directory: ./firmware/
        run: |
          bash bin/compile.sh \
            ${{ env.BOARD_META_PATH }} \
            ../simulator/build/rusefi_simulator.exe


      #
      # Build firmware.
      #
      - name: Build Firmware
        working-directory: ./firmware/
        run: |
          bash bin/compile.sh \
            ${{ env.BOARD_META_PATH }} \
            build_both_bundles \
            --output-sync=recurse


      #
      # Validation.
      #
      - name: Check for illegal time conversions
        working-directory: ./firmware/
        run: |
          bash check_illegal_conversion.sh


      #
      # ALWAYS upload bundle as an Actions artifact.
      #
      # The release job will later select ONLY brick.
      #
      - name: Upload firmware bundle
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rusefi_bundle_${{ matrix.build-target }}.zip
          path: ./artifacts/rusefi_bundle_${{ matrix.build-target }}.zip


      #
      # Autoupdate bundle.
      #
      - name: Upload autoupdate bundle
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: rusefi_bundle_${{ matrix.build-target }}_autoupdate.zip
          path: ./artifacts/rusefi_bundle_${{ matrix.build-target }}_autoupdate.zip


      #
      # Individual build artifacts.
      #

      - name: Create disassembly text
        run: |
          arm-none-eabi-objdump \
            -d ./firmware/build/rusefi.elf \
            > ./firmware/build/rusefi.txt


      - name: Upload text artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.txt
          path: ./firmware/build/rusefi.txt


      - name: Upload ELF artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.elf
          path: ./firmware/build/rusefi.elf


      - name: Upload MAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.map
          path: ./firmware/build/rusefi.map


      - name: Upload BIN artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.bin
          path: ./firmware/deliver/rusefi*.bin


      - name: Upload HEX artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.hex
          path: ./firmware/build/rusefi*.hex


      - name: Upload DFU artifact
        uses: actions/upload-artifact@v7
        with:
          name: rusefi_${{ matrix.build-target }}.dfu
          path: ./firmware/deliver/rusefi*.dfu


  #
  # Publish GitHub Release.
  #
  # IMPORTANT:
  # This job waits for the COMPLETE firmware matrix.
  #
  # It downloads ONLY:
  #
  #     rusefi_bundle_brick.zip
  #
  # and publishes ONLY that ZIP.
  #
  publish-release:
    runs-on: ubuntu-latest

    needs:
      - prepare-release
      - build-firmware

    if: ${{ needs.prepare-release.outputs.publish == 'true' }}

    steps:

      #
      # Download ONLY the Brick bundle.
      #
      - name: Download Brick bundle
        uses: actions/download-artifact@v7
        with:
          name: rusefi_bundle_brick.zip
          path: ./release-assets


      #
      # Verify the exact file exists.
      #
      - name: Verify Brick bundle
        shell: bash
        run: |
          echo "Release assets:"
          find ./release-assets -maxdepth 2 -type f -print

          test -f ./release-assets/rusefi_bundle_brick.zip


      #
      # Create the GitHub Release.
      #
      - name: Create Brick GitHub Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.name }}

          #
          # ONLY Brick.
          #
          artifacts: "./release-assets/rusefi_bundle_brick.zip"

          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          prerelease: true
          generateReleaseNotes: true
